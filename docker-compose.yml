services:
  activepieces:
    image: activepieces/activepieces:latest
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - redis
    environment:
      - AP_ENGINE_EXECUTABLE_PATH=dist/packages/engine/main.js
      - AP_ENCRYPTION_KEY=a8f3c2b1e4d5f6071a9b2c3d4e5f6a7b
      - AP_JWT_SECRET=cluster-activepieces-jwt-secret-local-dev
      - AP_FRONTEND_URL=http://localhost:8080
      - AP_WEBHOOK_TIMEOUT_SECONDS=30
      - AP_TRIGGER_DEFAULT_POLL_INTERVAL=5
      - AP_POSTGRES_DATABASE=activepieces
      - AP_POSTGRES_HOST=host.docker.internal
      - AP_POSTGRES_PORT=5432
      - AP_POSTGRES_USERNAME=postgres
      - AP_POSTGRES_PASSWORD=Green720
      - AP_REDIS_URL=redis://redis:6379
      - AP_SANDBOX_RUN_TIME_SECONDS=600
      - AP_SIGN_UP_ENABLED=false
      - AP_TELEMETRY_ENABLED=false
      - AP_EDITION=ce
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  redis_data:
